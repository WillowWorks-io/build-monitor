<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img" aria-label="Build Monitor">
  <title>Build Monitor</title>
  <style>
    /* The wordmark has to survive both GitHub themes. Light is the
       default so a viewer that reports no preference still reads. */
    .wm-strong { fill: #0b0e13; }
    .wm-soft   { fill: #5a6675; }
    @media (prefers-color-scheme: dark) {
      .wm-strong { fill: #e8edf5; }
      .wm-soft   { fill: #8f9bad; }
    }
  </style>
  <!-- Six tiles, one red: the failure sits top-left, where this board
       sorts it and where the eye lands. -->
  <g>
    <rect x="4"  y="12" width="24" height="24" rx="5" fill="#e0483d"/>
    <rect x="32" y="12" width="24" height="24" rx="5" fill="#22a55c"/>
    <rect x="60" y="12" width="24" height="24" rx="5" fill="#22a55c"/>
    <rect x="4"  y="40" width="24" height="24" rx="5" fill="#22a55c"/>
    <rect x="32" y="40" width="24" height="24" rx="5" fill="#2f6fd0"/>
    <rect x="60" y="40" width="24" height="24" rx="5" fill="#22a55c"/>
  </g>
  <text x="102" y="43" class="wm-strong" font-size="26" font-weight="700" letter-spacing="-0.7"
        font-family="ui-sans-serif, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif">build</text>
  <text x="102" y="72" class="wm-soft" font-size="26" font-weight="400" letter-spacing="-0.4"
        font-family="ui-sans-serif, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif">monitor</text>
</svg>
